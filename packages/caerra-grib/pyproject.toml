[project]
name = "caerra-grib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manuel Carrer", email = "manuel.carrer@zohomail.eu" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "earthkit-data>=1.2.3",
    "caerra_prep",
]

[project.scripts]
caerra-import = "caerra_grib.lumi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
caerra_prep = { path = "../prepare", editable = true }

[[tool.uv.dependency-metadata]]
name = "caerra_prep"
version = "1.0.0"
requires-dist = [
    # Removed anemoi packages since they limit 
    # earthkit-data to an ancient version
    "zarr==2.17.0",
    "eccodes==2.47.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.1",
    "typing-extensions>=4.12.2",
    "pydantic-core==2.46.1",
    "click>=8.4.2",
]
