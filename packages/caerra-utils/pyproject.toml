[project]
name = "caerra_utils"
description = "Utilities for CAERRA-TU-ML production runs"
version = "1.0.0"
requires-python = ">=3.12, <3.13"

dependencies = [
    "anemoi-transform==0.3.1",
    "anemoi-datasets==0.5.35",
    "anemoi-utils==0.5.2",
    "zarr==2.17.0",
    "eccodes==2.47.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.1",
    "typing-extensions>=4.12.2",
    "pydantic-core==2.46.1",
    "click>=8.4.2",
    "matplotlib>=3.11.2",
    "metview>=1.16.3",
    "pyqt6>=6.12.0",
    "xarray>=2026.7.0",
]

[project.scripts]
caerra-prep = "caerra_utils.prepare:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
