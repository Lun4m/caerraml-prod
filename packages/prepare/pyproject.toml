[project]
name = "caerra_prep"
description = "Prepare input datasets for CAERRA-TU-ML"
version = "1.0.0"
requires-python = ">=3.12, <3.13"

dependencies = [
    "anemoi-transform==0.3.1",
    "anemoi-datasets==0.5.35",
    "anemoi-utils==0.5.2",
    "zarr==2.17.0",
    "eccodes==2.47.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.1",
    "typing-extensions>=4.12.2",
    "pydantic-core==2.46.1",
]

[project.scripts]
caerra_prep = "caerra_prep.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
